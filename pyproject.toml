[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central-nvr"
version = "1.3.3"
description = "Central NVR WiFi - Aplicativo Desktop Linux para Gerenciamento, Descoberta ONVIF e Streaming RTSP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Othay"}
]
keywords = ["nvr", "onvif", "rtsp", "ptz", "cctv", "camera", "pyside6", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    # PySide6 6.12.0 decrementa a contagem de referências de True a cada emit() em Python < 3.12
    # (True não é imortal) e o processo aborta; o 6.11 não tem o problema
    "PySide6>=6.5.0,<6.12; python_version < '3.12'",
    "PySide6>=6.5.0; python_version >= '3.12'",
    "opencv-python-headless>=4.8.0",
    "av>=11.0.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "keyring>=24.0.0",
    "defusedxml>=0.7.1",
]

[project.scripts]
central-nvr = "central_nvr.app:main"

[tool.setuptools.packages.find]
where = ["src"]
