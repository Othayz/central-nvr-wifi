# Mantém atualizadas as versões fixadas por hash/SHA (Issue #20).
# - pip: requirements.lock é gerado com
#     pip-compile --generate-hashes --strip-extras --no-emit-index-url \
#       --output-file requirements.lock pyproject.toml
# - github-actions: actions referenciadas por SHA de commit (com a versão em comentário).
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # PySide6 6.12.x decrementa a contagem de referências de True a cada emit() em Python < 3.12
      # e o app aborta ("free(): invalid size"). O pyproject restringe <6.12 nessas versões e o
      # PR #51 tentou desfazer isso. Remover esta regra quando sair uma versão corrigida
      # (tests/test_pyside_emit_refcount.py confirma no CI com Python 3.10).
      - dependency-name: "pyside6"
        versions: ["6.12.x"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
