name: Build and Publish Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal AppImage & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tag matches project version
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          PKG_VER=$(grep -m1 '__version__' src/central_nvr/__init__.py | cut -d '"' -f 2)
          if [ "$TAG_VER" != "$PY_VER" ] || [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag ($TAG_VER) diverge de pyproject ($PY_VER) / __version__ ($PKG_VER)"; exit 1
          fi

      - name: Run Tests
        run: |
          pip install pytest
          python -m pytest tests/test_updater.py -q

      - name: Build Universal AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Create Source Archive (.tar.gz)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="central-nvr-${TAG_NAME}.tar.gz"
          mkdir -p dist
          tar --exclude='./.git' --exclude='./build' --exclude='./dist' --exclude='./venv' -czf "dist/${ARCHIVE_NAME}" .
          ls -la dist/

      - name: Verify Checksums
        run: |
          cd dist
          test -s sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.tar.gz
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
