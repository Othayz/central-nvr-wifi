name: Build and Publish Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal AppImage & Create Release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          PKG_VER=$(grep -m1 '__version__' src/central_nvr/__init__.py | cut -d '"' -f 2)
          if [ "$TAG_VER" != "$PY_VER" ] || [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag ($TAG_VER) diverge de pyproject ($PY_VER) / __version__ ($PKG_VER)"; exit 1
          fi

      - name: Install Qt system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install pytest
          python -m pytest tests/test_updater.py tests/test_update_flow.py -q

      - name: Build Universal AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Create Source Archive (.tar.gz)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)"
          fi
          ARCHIVE_NAME="central-nvr-${TAG_NAME}.tar.gz"
          mkdir -p dist
          tar --exclude='./.git' --exclude='./build' --exclude='./dist' --exclude='./venv' -czf "dist/${ARCHIVE_NAME}" .
          ls -la dist/

      - name: Verify Checksums
        run: |
          cd dist
          test -s sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Inspect GLIBC requirements
        run: |
          echo "=== Dependência máxima de GLIBC encontrada nos binários gerados ==="
          find build/ -type f -executable -exec strings {} + 2>/dev/null | grep -E '^GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -n 10 || true

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.tar.gz
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts (Dry Run)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
