name: Build and Publish Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

# Padrão sem escrita: só o job de publicação recebe contents: write (Issue #20)
permissions:
  contents: read

jobs:
  build:
    name: Build Universal AppImage
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Build Dependencies (lockfile com hashes)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes --no-deps -r requirements.lock

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          PY_VER=$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)
          PKG_VER=$(grep -m1 '__version__' src/central_nvr/__init__.py | cut -d '"' -f 2)
          if [ "$TAG_VER" != "$PY_VER" ] || [ "$TAG_VER" != "$PKG_VER" ]; then
            echo "Tag ($TAG_VER) diverge de pyproject ($PY_VER) / __version__ ($PKG_VER)"; exit 1
          fi

      - name: Install Qt and system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 appstream

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install --require-hashes --no-deps -r requirements-test.lock
          python -m pytest tests -q

      - name: Build Universal AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Verify AppImage Integrity & Dependencies
        run: |
          echo "=== Verificando integridade e dependências críticas do AppImage gerado ==="
          APPIMAGE_FILE=$(ls dist/Central_NVR_WiFi-*.AppImage | head -n1)
          FILESIZE=$(stat -c%s "$APPIMAGE_FILE")
          echo "Tamanho do binário: $FILESIZE bytes"
          if [ "$FILESIZE" -lt 100000000 ]; then
            echo "ERRO: O AppImage gerado possui menos de 100MB ($FILESIZE bytes). Falta de dependências (PySide6/Qt)!"
            exit 1
          fi
          build/appimage/Central_NVR_WiFi.AppDir/usr/bin/python3 -c "import PySide6, av, cv2, numpy, keyring, defusedxml; print('Verificação de imports no AppDir: OK')"

      - name: Create Source Archive (.tar.gz)
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$(grep -m1 'version = ' pyproject.toml | cut -d '"' -f 2)"
          fi
          ARCHIVE_NAME="central-nvr-${TAG_NAME}.tar.gz"
          mkdir -p dist
          # git archive gera exatamente o conteúdo versionado do commit,
          # sem __pycache__/, .pytest_cache/ ou resíduos do build.
          git archive --format=tar.gz --prefix="central-nvr-${TAG_NAME}/" -o "dist/${ARCHIVE_NAME}" HEAD
          ls -la dist/

      - name: Verify Checksums
        run: |
          cd dist
          test -s sha256sums.txt
          sha256sum -c sha256sums.txt

      - name: Inspect GLIBC requirements
        run: |
          echo "=== Dependência máxima de GLIBC encontrada nos binários gerados ==="
          find build/ -type f -executable -exec strings {} + 2>/dev/null | grep -E '^GLIBC_[0-9]+\.[0-9]+' | sort -V | tail -n 10 || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # Único job com escrita: não instala nem executa código do projeto, só publica o artefato
    permissions:
      contents: write

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-dist
          path: dist/

      - name: Verify Checksums
        run: |
          cd dist
          sha256sum -c sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.tar.gz
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
