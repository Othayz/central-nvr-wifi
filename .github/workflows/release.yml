name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Universal AppImage & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Universal AppImage
        run: |
          chmod +x packaging/build_appimage.sh
          ./packaging/build_appimage.sh

      - name: Create Source Archive (.tar.gz)
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          ARCHIVE_NAME="central-nvr-${TAG_NAME}.tar.gz"
          mkdir -p dist
          tar --exclude='./.git' --exclude='./build' --exclude='./dist' --exclude='./venv' -czf "dist/${ARCHIVE_NAME}" .
          ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.sha256
            dist/*.tar.gz
            dist/sha256sums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
